<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Image Viewer</title>
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0a0a0f;color:#e2e8f0;font-family:'DM Sans',system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;}

        /* ── Toolbar ── */
        #toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:rgba(15,23,42,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.07);gap:12px;flex-shrink:0;z-index:10;}
        #filename{font-size:.9rem;font-weight:600;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px;}
        .tb-group{display:flex;align-items:center;gap:6px;}
        .tb-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#cbd5e1;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:6px;transition:background .15s,color .15s;}
        .tb-btn:hover{background:rgba(20,184,166,.18);border-color:rgba(20,184,166,.4);color:#2dd4bf;}
        .tb-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;}
        #zoom-level{font-size:.8rem;color:#94a3b8;min-width:44px;text-align:center;}

        /* ── Canvas area ── */
        #viewer{flex:1;overflow:hidden;position:relative;cursor:grab;display:flex;align-items:center;justify-content:center;}
        #viewer.grabbing{cursor:grabbing;}
        #img-wrap{position:absolute;transform-origin:center center;transition:transform .12s ease;}
        #img-wrap.no-transition{transition:none;}
        #main-img{display:block;max-width:none;max-height:none;user-select:none;-webkit-user-drag:none;border-radius:4px;box-shadow:0 8px 48px rgba(0,0,0,.7);}

        /* ── Loading / error ── */
        #loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#94a3b8;font-size:.9rem;}
        .spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.08);border-top-color:#14b8a6;border-radius:50%;animation:spin .7s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}

        /* ── Info bar ── */
        #info-bar{background:rgba(15,23,42,.9);border-top:1px solid rgba(255,255,255,.07);padding:6px 18px;font-size:.75rem;color:#64748b;display:flex;gap:24px;flex-shrink:0;}

        /* ── Keyboard hint ── */
        #hint{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#94a3b8;font-size:.72rem;padding:6px 14px;border-radius:20px;pointer-events:none;opacity:1;transition:opacity 1s;white-space:nowrap;}
        #hint.fade{opacity:0;}
    </style>
</head>
<body>

<div id="toolbar">
    <span id="filename">Image</span>
    <div class="tb-group">
        <button class="tb-btn" id="btn-zoom-out" title="Zoom Out (-)">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <span id="zoom-level">100%</span>
        <button class="tb-btn" id="btn-zoom-in" title="Zoom In (+)">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <button class="tb-btn" id="btn-fit" title="Fit to Screen (F)">
            <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            Fit
        </button>
        <button class="tb-btn" id="btn-actual" title="Actual Size (1)">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6v6H9z"/></svg>
            1:1
        </button>
    </div>
    <div class="tb-group">
        <button class="tb-btn" id="btn-rotate-ccw" title="Rotate Left (←)">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="tb-btn" id="btn-rotate-cw" title="Rotate Right (→)">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button class="tb-btn" id="btn-flip-h" title="Flip Horizontal">
            <svg viewBox="0 0 24 24"><path d="M12 3v18M4 7l-3 5 3 5M20 7l3 5-3 5"/></svg>
        </button>
    </div>
    <div class="tb-group">
        <button class="tb-btn" id="btn-download" title="Download">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download
        </button>
        <button class="tb-btn" id="btn-fullscreen" title="Fullscreen (F11)">
            <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
    </div>
</div>

<div id="viewer">
    <div id="loading"><div class="spinner"></div><span>Loading image…</span></div>
    <div id="img-wrap" style="display:none;">
        <img id="main-img" alt=""/>
    </div>
    <div id="hint">Scroll to zoom · Drag to pan · R to reset</div>
</div>

<div id="info-bar">
    <span id="info-dims">–</span>
    <span id="info-size">–</span>
    <span id="info-type">–</span>
</div>

<script>
(function () {
    const params   = new URLSearchParams(location.search);
    const filePath = params.get('path') || '';
    const fileUrl  = '/file?path=' + filePath;
    const fileName = filePath.split('/').pop();

    document.getElementById('filename').textContent = fileName;
    document.title = fileName + ' — Image Viewer';

    // ── State ──
    let scale = 1, rotation = 0, flipH = false;
    let panX = 0, panY = 0;
    let dragging = false, lastX = 0, lastY = 0;
    const MIN_SCALE = 0.05, MAX_SCALE = 20;

    const viewer  = document.getElementById('viewer');
    const imgWrap = document.getElementById('img-wrap');
    const img     = document.getElementById('main-img');
    const zoomEl  = document.getElementById('zoom-level');

    function applyTransform(animate = true) {
        imgWrap.classList.toggle('no-transition', !animate);
        imgWrap.style.transform =
            `translate(${panX}px,${panY}px) rotate(${rotation}deg) scaleX(${flipH ? -scale : scale}) scaleY(${scale})`;
        zoomEl.textContent = Math.round(scale * 100) + '%';
    }

    function fitToScreen() {
        const vw = viewer.clientWidth  - 40;
        const vh = viewer.clientHeight - 40;
        const iw = img.naturalWidth  || img.width  || 1;
        const ih = img.naturalHeight || img.height || 1;
        scale = Math.min(vw / iw, vh / ih, 1);
        panX = panY = 0;
        applyTransform();
    }

    // ── Load ──
    img.onload = () => {
        document.getElementById('loading').style.display = 'none';
        imgWrap.style.display = '';
        fitToScreen();
        document.getElementById('info-dims').textContent = img.naturalWidth + ' × ' + img.naturalHeight + ' px';
        document.getElementById('info-type').textContent = fileName.split('.').pop().toUpperCase();
        setTimeout(() => document.getElementById('hint').classList.add('fade'), 3000);
    };
    img.onerror = () => {
        document.getElementById('loading').innerHTML = '<span style="color:#f43f5e">❌ Failed to load image</span>';
    };
    img.src = fileUrl;

    // ── Zoom ──
    function zoomBy(delta, cx, cy) {
        const oldScale = scale;
        scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * delta));
        // Zoom toward pointer
        if (cx !== undefined) {
            const rect = viewer.getBoundingClientRect();
            const ox = cx - rect.left - rect.width  / 2 - panX;
            const oy = cy - rect.top  - rect.height / 2 - panY;
            panX -= ox * (scale / oldScale - 1);
            panY -= oy * (scale / oldScale - 1);
        }
        applyTransform(false);
    }

    viewer.addEventListener('wheel', e => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 1.12 : 1 / 1.12;
        zoomBy(delta, e.clientX, e.clientY);
    }, {passive: false});

    // ── Pan ──
    viewer.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        dragging = true; lastX = e.clientX; lastY = e.clientY;
        viewer.classList.add('grabbing');
    });
    window.addEventListener('mousemove', e => {
        if (!dragging) return;
        panX += e.clientX - lastX; panY += e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        applyTransform(false);
    });
    window.addEventListener('mouseup', () => { dragging = false; viewer.classList.remove('grabbing'); });

    // Touch pan + pinch zoom
    let lastTouchDist = null;
    viewer.addEventListener('touchstart', e => {
        if (e.touches.length === 1) { lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
        if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            lastTouchDist = Math.hypot(dx, dy);
        }
    }, {passive: true});
    viewer.addEventListener('touchmove', e => {
        e.preventDefault();
        if (e.touches.length === 1) {
            panX += e.touches[0].clientX - lastX; panY += e.touches[0].clientY - lastY;
            lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
            applyTransform(false);
        }
        if (e.touches.length === 2 && lastTouchDist) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            zoomBy(dist / lastTouchDist);
            lastTouchDist = dist;
        }
    }, {passive: false});
    viewer.addEventListener('touchend', () => { lastTouchDist = null; });

    // ── Toolbar buttons ──
    document.getElementById('btn-zoom-in').addEventListener('click',  () => zoomBy(1.25));
    document.getElementById('btn-zoom-out').addEventListener('click', () => zoomBy(0.8));
    document.getElementById('btn-fit').addEventListener('click',      fitToScreen);
    document.getElementById('btn-actual').addEventListener('click',   () => { scale = 1; panX = panY = 0; applyTransform(); });
    document.getElementById('btn-rotate-cw').addEventListener('click',  () => { rotation = (rotation + 90) % 360; applyTransform(); });
    document.getElementById('btn-rotate-ccw').addEventListener('click', () => { rotation = (rotation - 90 + 360) % 360; applyTransform(); });
    document.getElementById('btn-flip-h').addEventListener('click',     () => { flipH = !flipH; applyTransform(); });
    document.getElementById('btn-download').addEventListener('click',   () => {
        const a = document.createElement('a'); a.href = fileUrl;
        a.download = fileName; a.click();
    });
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    });

    // ── Keyboard shortcuts ──
    document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT') return;
        switch (e.key) {
            case '+': case '=': zoomBy(1.25); break;
            case '-': zoomBy(0.8); break;
            case 'f': case 'F': fitToScreen(); break;
            case '1': scale = 1; panX = panY = 0; applyTransform(); break;
            case 'r': case 'R': scale = 1; panX = panY = 0; rotation = 0; flipH = false; applyTransform(); break;
            case 'ArrowLeft':  if (e.shiftKey) { rotation = (rotation - 90 + 360) % 360; applyTransform(); } break;
            case 'ArrowRight': if (e.shiftKey) { rotation = (rotation + 90) % 360; applyTransform(); } break;
        }
    });

    // Double-click to toggle fit/actual
    viewer.addEventListener('dblclick', e => {
        if (Math.abs(scale - 1) < 0.05) { fitToScreen(); } else { scale = 1; panX = panY = 0; applyTransform(); }
    });
})();
</script>
</body>
</html>
